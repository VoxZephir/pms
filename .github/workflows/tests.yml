# The whole suite on every push: it runs without the private statement
# (tests/synthetic.py), so nothing personal is needed here. The parser's
# tests on the real PDF are skipped, as on any clean clone.
name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python and dependencies (uv.lock)
        run: uv sync --locked --extra web
      - name: Front-end dependencies
        run: npm ci
        working-directory: frontend
      # The runner's Google Chrome is what test_browser.py drives; tsc,
      # Vitest and the rebuild-and-compare run in test_frontend.py.
      - name: Tests
        run: uv run --no-sync pytest tests -q -n auto --dist loadgroup
