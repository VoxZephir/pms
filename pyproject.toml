[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pms"
version = "0.2.0"
description = "Analyse de relevés de transactions Swissquote"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    # Encrypts the backups (backup.py). pdfminer already depends on it; named
    # here so the encryption does not rest on another package's choice.
    "cryptography>=41",
]

[project.optional-dependencies]
web = [
    "Flask>=3.1",
    # The optional assistant (pms/ai.py) when its provider is Claude. Imported
    # only when called: without it, or without data/ai.json, the app runs as
    # before. DeepSeek and Ollama need nothing beyond the standard library.
    "anthropic>=1.0",
]

# The tests' tooling: installed by `run.bat --test` (`uv sync`), left out of
# a plain launch (`--no-dev`). Exact versions live in uv.lock.
[dependency-groups]
dev = [
    "pytest>=8",
    # Run by tests/test_lint.py, so its rules hold without anyone remembering it.
    "ruff>=0.16",
    # Drives the installed Edge or Chrome for tests/test_browser.py -- no
    # `playwright install`, no browser download.
    "playwright>=1.50",
    # The PDF redaction tool (redact.py, caviarder.bat): rewrites the page
    # content so a redacted word is gone from the file, not hidden under a
    # box. Kept out of the app's own install; 1.x has no dependency of its
    # own. AGPL -- fine for a personal tool, to weigh before anything sold.
    "pymupdf>=1.24,<2",
]

[project.scripts]
pms = "pms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pms = ["web/static/*", "web/static/spa/*", "web/static/spa/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Bugs, not style. Each family is here because this project shipped its bug:
# a name read before its local assignment (F823: `balance_chart =
# balance_chart(...)`), an import shadowed by a function of the same name
# (F811: a route called `analysis`), and a control character that made a
# regex alternative never match (PLE2510: a backspace after "Régie").
select = ["F", "E9", "B", "PLE"]
# zip(strict=True) would turn the pairwise `zip(rows, rows[1:])` idiom into
# an error.
ignore = ["B905"]
